name: Frontend CI
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: actions/checkout@v3
        with:
          sparse-checkout: 'frontend'
          sparse-checkout-cone-mode: false
          path: './'
      - name: Double check file structure
        run: ls -lah
      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          run_install: true
          version: latest
      - name: Unit tests
        run: pnpm test:unit
      - name: Lint
        run: pnpm lint
