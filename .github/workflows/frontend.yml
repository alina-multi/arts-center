name: Frontend CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: actions/checkout@v3
        with:
          sparse-checkout: 'frontend'
          sparse-checkout-cone-mode: false
      - name: Move app files to root
        run: |
          ls -lah
          shopt -s dotglob
          mv frontend/* .
          rm -rf frontend
          ls -lah
      - uses: pnpm/action-setup@v2
        name: Install pnpm
        with:
          run_install: true
          version: latest
      - name: Prisma
        run: pnpm prisma generate
      - name: Build svelte kit
        run: pnpm build
      - name: Unit tests
        run: pnpm test:unit
      - name: Lint
        run: pnpm lint
