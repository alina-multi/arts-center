apiVersion: v1
kind: Service
metadata:
  name: arts2-horizon
  labels:
    app: arts2
spec:
  ports:
    - port: 80
  selector:
    app: arts2
    tier: horizon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-deployment
  labels:
    app: arts2
spec:
  selector:
    matchLabels:
      app: arts2
      tier: horizon
  template:
    metadata:
      labels:
        app: arts2
        tier: horizon
    spec:
      containers:
        - name: horizon
          image: registry.gitlab.com/new-arts/backend
          args: ["php", "/var/www/artisan", "horizon"]
      imagePullSecrets:
        - name: gitlab
---
apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: horizon-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: horizon-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 80