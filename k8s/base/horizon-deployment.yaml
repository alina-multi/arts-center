apiVersion: v1
kind: Service
metadata:
  name: arts2-horizon
  labels:
    app: arts2
spec:
  ports:
    - port: 80
  selector:
    app: arts2
    tier: horizon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-deployment
  labels:
    app: arts2
spec:
  selector:
    matchLabels:
      app: arts2
      tier: horizon
  template:
    metadata:
      labels:
        app: arts2
        tier: horizon
    spec:
      containers:
        - name: horizon
          image: registry.gitlab.com/new-arts/backend
          args: ["php", "/var/www/artisan", "horizon"]
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: port
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
      imagePullSecrets:
        - name: gitlab