apiVersion: v1
kind: Service
metadata:
  name: arts2-backend
  labels:
    app: arts2
spec:
  ports:
    - port: 9000
  selector:
    app: arts2
    tier: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: arts2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arts2
      tier: backend
  template:
    metadata:
      labels:
        app: arts2
        tier: backend
    spec:
      containers:
        - name: backend
          image: registry.gitlab.com/new-arts/backend
          ports:
            - containerPort: 9000
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: port
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
            - name: OLD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: password
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-pass
                  key: id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-pass
                  key: key
            - name: S3_URL
              valueFrom:
                secretKeyRef:
                  name: s3-pass
                  key: url
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-pass
                  key: bucket
            - name: S3_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-pass
                  key: region
            - name: STRIPE_KEY
              value: pk_test_51JXVETAyaQZJdCRgapG1ZMPCQLo8QTGsasIajz5HiX2PCrt7NZPkm68A8bVrWNzWkYxsQr4AYs9uCVbHKTN4Kf8U00iDcL1bpr
            - name: STRIPE_SECRET
              value: sk_test_51JXVETAyaQZJdCRgMhFHvaNsaIDJsRXZZT1NNZwFvmE6dmlk1auNIpjoze0rmfDW32q5jvbawh5ecC7lvd5411iV00ErQMgCvO


      imagePullSecrets:
        - name: gitlab
---
apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 80