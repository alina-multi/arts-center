apiVersion: v1
kind: Service
metadata:
  name: arts2-backend
  labels:
    app: arts2
spec:
  ports:
    - port: 9000
  selector:
    app: arts2
    tier: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: arts2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arts2
      tier: backend
  template:
    metadata:
      labels:
        app: arts2
        tier: backend
    spec:
      containers:
        - name: backend
          image: registry.gitlab.com/new-arts/backend
          ports:
            - containerPort: 9000
      imagePullSecrets:
        - name: gitlab
      priorityClassName: site
---
apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 1
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 80