image: docker:19.03.12

variables:
  MOUNT_POINT: /builds/$CI_PROJECT_PATH/mnt
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - docker:19.03.13-dind

before_script:
  - docker info

build:
  stage: build
  script:
    - docker build -t my-docker-image .
    - docker run -it --entrypoint /bin/bash my-docker-image php artisan test
